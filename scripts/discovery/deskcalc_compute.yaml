# Scripted discovery for the desktop target, for `cua discover --llm scripted`.
#
# The path a person takes in DeskCalc (deskapp/deskcalc.ps1) to work out one
# calculation. It runs through the same discovery loop, policy checks and
# recorder as the web scripts; only the surface under them is Windows UI
# Automation, picked by the desk tenant.
#
#   cua discover --llm scripted --script scripts/discovery/deskcalc_compute.yaml \
#     --tenant desk --policy policies/deskcalc.yaml \
#     --goal "Work out a calculation in DeskCalc and return the result" \
#     --name deskcalc_compute --entry / \
#     --param first:decimal=12.5 --param second:decimal=4 --param operation:string=Divide \
#     --output result:decimal
goal: Work out a calculation in DeskCalc and return the result
steps:
  - tool: type
    target: [{strategy: role_name, role: textbox, name: First number}]
    text: "12.5"
    reason: The first operand goes in the field labelled First number.
  - tool: type
    target: [{strategy: role_name, role: textbox, name: Second number}]
    text: "4"
    reason: Then the second operand.
  - tool: select
    target: [{strategy: role_name, role: combobox, name: Operation}]
    text: Divide
    reason: The operation is chosen from the Operation list.
  - tool: click
    target: [{strategy: role_name, role: button, name: Calculate}]
    reason: Calculate fills the read-only Result field.
  - tool: done
    outputs:
      result:
        - {strategy: role_name, role: textbox, name: Result}
    reason: The Result field holds the answer.
