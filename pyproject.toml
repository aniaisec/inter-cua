[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inter-cua"
version = "0.1.0"
description = "Goal-driven UI discovery, reviewable capability artifacts, and deterministic replay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.40,<1.0",
  "fastapi>=0.115,<1.0",
  "google-genai>=2.0,<3.0",
  "jinja2>=3.1,<4.0",
  "playwright>=1.48,<2.0",
  "pydantic>=2.9,<3.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0,<7.0",
  "python-ulid>=2.7,<4.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[project.scripts]
cua = "cua.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cua", "mockapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  # Raised inside google-genai on Python 3.14, not by this code.
  "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google.genai",
]
markers = [
  "browser: requires a Playwright Chromium install",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
files = ["src", "mockapp"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mockapp.*"]
# The mock app is the target, not the system under test. It stays typed but is
# allowed to hand untyped context dicts to Jinja.
disallow_any_explicit = false
