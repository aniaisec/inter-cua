name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extra: base
            source: wheel
            browser: true
          - os: ubuntu-latest
            extra: base
            source: sdist
            browser: true
          - os: ubuntu-latest
            extra: anthropic
            source: wheel
          - os: ubuntu-latest
            extra: gemini
            source: wheel
          - os: ubuntu-latest
            extra: discovery
            source: wheel
          - os: ubuntu-latest
            extra: vision
            source: wheel
          - os: windows-latest
            extra: windows
            source: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CUA_CHROMIUM_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c constraints/dev-py311.txt build hatchling playwright
      - run: python -m build --no-isolation --outdir dist
      - name: Check wheel and sdist contents
        shell: bash
        run: python scripts/ci/check_distribution.py dist/*.whl dist/*.tar.gz
      - if: matrix.browser
        run: python -m playwright install --with-deps chromium
      - name: Test fresh non-editable installation
        run: >-
          python scripts/ci/verify_installed.py dist --extra ${{ matrix.extra }}
          ${{ matrix.source == 'sdist' && '--from-sdist' || '' }}
          ${{ matrix.browser && '--browser' || '' }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c constraints/dev-py311.txt -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m mypy --platform win32
      - run: python -m pytest -m 'not browser and not desktop' --junitxml=artifacts/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: artifacts/unit.xml

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUA_CHROMIUM_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c constraints/dev-py311.txt -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest --require-browser -m 'browser and not desktop' --junitxml=artifacts/browser.xml
      - name: Deterministic benchmark smoke
        run: >-
          python -m cua.cli benchmark run --suite core --llm scripted
          --strategy inter_cua_replay --repetitions 2
          --task lookup-success --task lookup-unknown-member --task open-without-consent
          --reports-dir artifacts/benchmark
      - run: python -m cua.cli benchmark report --latest --reports-dir artifacts/benchmark
      - run: python scripts/ci/check_benchmark.py artifacts/benchmark
      - name: Full security benchmark
        if: ${{ !cancelled() }}
        run: python -m cua.cli security run --out artifacts/security --runs-root bench/security/runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-benchmark-security
          retention-days: 14
          path: |
            artifacts/browser.xml
            artifacts/benchmark/*.jsonl
            artifacts/benchmark/summary.*
            artifacts/security/summary.*
